name: verify

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Verification harnesses use the dev sign-in path and expect the API on 8788.
      PORT: 8788
      HOST: 127.0.0.1
      API: http://127.0.0.1:8788
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (app + backend)
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npm run typecheck:backend

      - name: Build
        run: npm run build

      - name: Start API
        run: |
          npm run dev:backend &
          for attempt in $(seq 1 40); do
            if curl -fsS "$API/api/health" > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start"
          exit 1

      - name: Verify (authority, auth, scoring, determinism, cash timing, statements, render, contrast, replay, legit play)
        run: npm run verify

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-data
          path: |
            backend/data/
            *.log
          if-no-files-found: ignore
          retention-days: 7
